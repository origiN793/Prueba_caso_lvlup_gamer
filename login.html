<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion - Level-Up Gamer</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="encabezado">
    <div class="contenedor">
      <div class="logo">LEVEL-UP <span>GAMER</span></div>
      <button class="boton-menu" id="boton-menu">☰</button>
      <ul class="menu" id="menu-principal">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blog</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
      <div class="acciones-header">
        <a href="carrito.html" class="carrito-link">Carrito (<span class="contador-carrito">0</span>)</a>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <div class="tarjeta-formulario">
      <h1>Iniciar sesion</h1>

      <div class="mensaje-exito" id="mensaje-exito-login">Sesion iniciada correctamente (simulacion).</div>

      <form id="formulario-login">
        <div class="campo">
          <label for="correo-login">Correo electronico</label>
          <input type="email" id="correo-login" maxlength="100">
          <span class="mensaje-error"></span>
        </div>

        <div class="campo">
          <label for="clave-login">Contrasena</label>
          <input type="password" id="clave-login">
          <span class="mensaje-error"></span>
        </div>

        <button type="submit" class="boton" style="width:100%;">Iniciar sesion</button>
      </form>

      <p style="text-align:center; margin-top:15px;">
        No tienes cuenta? <a href="registro.html">Registrate aqui</a>
      </p>
    </div>
  </main>

  <footer class="pie-pagina">
    <div class="contenedor">
      <p>Level-Up Gamer &copy; <span id="anio-actual"></span> - Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/menu.js"></script>
  <script>
    var formularioLogin = document.getElementById("formulario-login");

    formularioLogin.addEventListener("submit", function (evento) {
      evento.preventDefault();

      var correoValido = validarCorreo("correo-login");
      var claveValida = validarPassword("clave-login");

      if (correoValido && claveValida) {
        document.getElementById("mensaje-exito-login").style.display = "block";
        setTimeout(function () {
          window.location.href = "index.html";
        }, 1000);
      }
    });
  </script>
</body>
</html>
